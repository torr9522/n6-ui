<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
<a-layout id="app" v-cloak>
    {{ template "commonSider" . }}
    <a-layout id="content-layout">
        <a-layout-content style="margin: 24px 16px;">
            <a-card title="N5设置">
                <a-form layout="vertical">
                    <a-row :gutter="16">
                        <a-col :xs="24" :sm="16">
                            <a-form-item label="启用 N5 Xray 扩展">
                                <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
                                    <div>
                                        <div style="font-weight: 500;">[[ statusText ]]</div>
                                        <div style="color: rgba(0, 0, 0, 0.45); margin-top: 4px;">
                                            开启后，N5 出口与分流规则会合并到 Xray 运行配置。
                                            关闭后，N5 扩展配置不会参与 Xray merge。
                                        </div>
                                    </div>
                                    <a-switch v-model="enabled"></a-switch>
                                </div>
                            </a-form-item>
                        </a-col>
                    </a-row>
                    <a-button type="primary" :loading="saving" @click="save">保存设置</a-button>
                    <a-button style="margin-left: 8px" :loading="loading" @click="load">刷新</a-button>
                </a-form>
            </a-card>
        </a-layout-content>
    </a-layout>
</a-layout>
{{template "js" .}}
<script>
    const app = new Vue({
        el: '#app',
        delimiters: ['[[', ']]'],
        data: {
            siderDrawer,
            loading: false,
            saving: false,
            enabled: false,
        },
        computed: {
            statusText() {
                return this.enabled ? '当前状态：已启用' : '当前状态：已停用';
            },
        },
        methods: {
            async load() {
                this.loading = true;
                const msg = await HttpUtil.get('/n5/api/settings');
                this.loading = false;
                if (!msg.success || !msg.obj) {
                    return;
                }
                this.enabled = !!msg.obj.enabled;
            },
            async save() {
                this.saving = true;
                const msg = await HttpUtil.post('/n5/api/settings', { enabled: this.enabled });
                this.saving = false;
                if (!msg.success || !msg.obj) {
                    return;
                }
                this.enabled = !!msg.obj.enabled;
                this.$message.success('N5 设置已保存，等待自动应用');
            },
        },
        async mounted() {
            await this.load();
        },
    });
</script>
</body>
</html>
